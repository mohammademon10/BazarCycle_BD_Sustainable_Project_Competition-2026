services:
  - type: web
    name: bazarcycle-bd
    env: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        value: 1079966218053-p7aekvpq7lar4ljpdgh3m838ir1309tl.apps.googleusercontent.com
      - key: GOOGLE_CLIENT_ID
        value: 1079966218053-p7aekvpq7lar4ljpdgh3m838ir1309tl.apps.googleusercontent.com
